name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install Stockfish
        if: matrix.os == 'ubuntu-latest'
        # Integration tests need it on PATH; they skip themselves on the other OSes.
        run: |
          sudo apt-get update && sudo apt-get install -y stockfish
          which stockfish
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx pyrefly check
