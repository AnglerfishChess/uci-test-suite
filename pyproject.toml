[project]
name = "uci-test-suite"
version = "0.2.0"
description = "A Python-based set of tests for UCI server/chess engine implementations"
authors = [
    {name = "Alex Myodov", email = "amyodov@gmail.com"}
]
license = {text = "MIT License"}
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["chess", "UCI", "chess engine", "testing", "test suite", "uci protocol", "uci chess"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2,<2.0.0",
    "click>=8.1.8,<9.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pyrefly>=0.16.0",
    "ruff>=0.11.4",
]

[project.scripts]
uci-test-suite = "uci_test_suite.__main__:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["uci_test_suite", "uci_test_suite.checks"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pyrefly]
project-includes = ["uci_test_suite", "tests"]
search-path = [".", "tests"]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "stockfish: integration test requiring the stockfish binary on PATH",
]
